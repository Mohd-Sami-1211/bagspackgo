name: Build and Deploy

on:
  push:
    branches: [ kavi/deployment ]
  pull_request:
    branches: [ kavi/deployment ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4.1.7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run build
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Deploy
      run: npm run deploy
